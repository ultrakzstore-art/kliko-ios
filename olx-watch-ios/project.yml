# OLX Watch — личное iPhone-приложение: лента новых объявлений OLX.kz и пуши.
# Отдельное приложение с аккаунта разработчика Kliko, bundle id kz.kliko.olxwatch.
# Проверки OLX идут прямо с телефона (сервер не нужен). Сборка —
# .github/workflows/olx-watch-ios.yml, тем же способом, что и Kliko.
name: OLXWatch
options:
  bundleIdPrefix: kz.kliko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # подставляет сборка из секрета APPLE_TEAM_ID
    SWIFT_VERSION: "5.9"
targets:
  OLXWatch:
    type: application
    platform: iOS
    sources:
      - Sources
    entitlements:
      path: OLXWatch.entitlements
      properties:
        aps-environment: production   # TestFlight; на сервере apns_env => 'production'
    info:
      path: OLXWatch-Info.plist
      properties:
        CFBundleDisplayName: OLX Watch
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Фоновое обновление: iOS изредка будит приложение проверить поиски (AppModel.refreshTaskId).
        UIBackgroundModes: [fetch, remote-notification]   # фоновое обновление + тихие пуши-будильники
        BGTaskSchedulerPermittedIdentifiers: [kz.kliko.olxwatch.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.olxwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
