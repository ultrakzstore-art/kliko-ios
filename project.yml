name: Kliko
options:
  bundleIdPrefix: kz.kliko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team ID подставляет сборка: xcodebuild получает DEVELOPMENT_TEAM аргументом из
    # секрета APPLE_TEAM_ID (.github/workflows/ios.yml). Здесь пусто намеренно — Team ID
    # виден в архиве и в логах, и держать его в репозитории незачем.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
targets:
  # ── Приложение: PWA-обёртка ──
  Kliko:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared                      # общие с виджетом типы (DealActivityAttributes)
    dependencies:
      - target: KlikoWidgets        # встраиваем виджет-расширение в приложение
    entitlements:
      path: Kliko.entitlements
      properties:
        # production, а не development. Профиль распространения, который создаёт сборка,
        # несёт aps-environment=production, и расхождение с этим файлом ломает подпись.
        # Сервер обязан быть в том же окружении: APNS_ENV='production' в admin_config.php,
        # иначе APNs отвечает BadDeviceToken и пуши молча не доходят.
        # Появится Mac и отладка на устройстве из Xcode — тогда здесь development, а на
        # сервере APNS_ENV='sandbox'; менять надо ОБА, поодиночке они бесполезны.
        aps-environment: production
    info:
      path: Kliko-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]      # фоновые/тихие пуши
        NSSupportsLiveActivities: true                # Live Activity сделки (локскрин/Dynamic Island)
        NSCameraUsageDescription: "Камера нужна для фото товара и проверки по QR."
        NSMicrophoneUsageDescription: "Микрофон нужен для голосовых сообщений в чате."
        NSPhotoLibraryUsageDescription: "Доступ к фото — чтобы прикреплять изображения к объявлению."
        NSPhotoLibraryAddUsageDescription: "Сохранение изображений из объявлений в галерею."
        NSLocationWhenInUseUsageDescription: "Геолокация показывает объявления рядом и помогает в доставке."
        # Приложение шифрует только через системный HTTPS — это освобождённый случай.
        # Без этого ключа App Store Connect задаёт вопрос об экспортном соответствии на
        # КАЖДОЙ загрузке, и сборка висит в статусе «ожидает ответа» вместо TestFlight.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # иконка из Sources/Assets.xcassets/AppIcon.appiconset

  # ── Виджет-расширение: Live Activity сделки ──
  KlikoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetSources
      - Shared                      # тот же DealActivityAttributes
    info:
      path: KlikoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app.widgets
# ATS: наш API по HTTPS — исключений не требуется. Для http-стейджа добавь NSAppTransportSecurity в info-properties.
