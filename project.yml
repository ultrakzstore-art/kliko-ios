name: Kliko
options:
  bundleIdPrefix: kz.kliko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team ID подставляет сборка: xcodebuild получает DEVELOPMENT_TEAM аргументом из
    # секрета APPLE_TEAM_ID (.github/workflows/ios.yml). Здесь пусто намеренно — Team ID
    # виден в архиве и в логах, и держать его в репозитории незачем.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
# ЛОКАЛЬНЫЕ ПОКУПКИ ДЛЯ СИМУЛЯТОРА. Kliko.storekit — те же product id, что в ПродуктыApple (StoreKitStore.swift), с
# примерными ценами витрины Казахстана. Файл лежит в проекте (fileGroups — без членства в целевой сборке, в приложение
# не попадает) и подключён к схеме Kliko ниже: запуск из Xcode на симуляторе покупает у локального StoreKit, без App
# Store Connect. Архив и TestFlight его не видят — там товары из App Store Connect (Sandbox).
fileGroups:
  - Kliko.storekit
targets:
  # ── Приложение: PWA-обёртка ──
  Kliko:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared                      # общие с виджетом типы (DealActivityAttributes)
    dependencies:
      - target: KlikoWidgets        # встраиваем виджет-расширение в приложение
    # Схема Kliko (её же собирает CI: -scheme Kliko). Своё здесь одно — файл StoreKit для запуска из Xcode.
    # In-App Purchase отдельного entitlement не требует: возможность включена у каждого App ID, StoreKit 2 работает
    # без правок в Kliko.entitlements.
    scheme:
      storeKitConfiguration: Kliko.storekit
    entitlements:
      path: Kliko.entitlements
      properties:
        # production, а не development. Профиль распространения, который создаёт сборка,
        # несёт aps-environment=production, и расхождение с этим файлом ломает подпись.
        # Сервер обязан быть в том же окружении: APNS_ENV='production' в admin_config.php,
        # иначе APNs отвечает BadDeviceToken и пуши молча не доходят.
        # Появится Mac и отладка на устройстве из Xcode — тогда здесь development, а на
        # сервере APNS_ENV='sandbox'; менять надо ОБА, поодиночке они бесполезны.
        aps-environment: production
        # ССЫЛКИ САЙТА ОТКРЫВАЕТ ПРИЛОЖЕНИЕ (Universal Links). Человек находит объявление в поиске и
        # нажимает — iOS поднимает приложение на той же странице вместо Safari. Пара к файлу
        # https://kliko.kz/.well-known/apple-app-site-association (сервер: aasa.php + inc/app_deeplink.php),
        # который обязан отдавать TEAMID.kz.kliko.app. Нет файла или Team ID в нём другой — ссылки просто
        # открываются в Safari, как раньше; ничего не ломается.
        # Только apex-домен: www.kliko.kz за файлом отвечает перенаправлением, а Apple перенаправления при
        # проверке не ходит — такой домен не подтвердился бы.
        # webcredentials — общие с сайтом пароли и коды из SMS: те же ключи Связки для kliko.kz.
        # Возможность Associated Domains у App ID включает сама сборка: xcodebuild ходит с
        # -allowProvisioningUpdates и ключом App Store Connect, профиль перевыпускается автоматически.
        com.apple.developer.associated-domains:
          - applinks:kliko.kz
          - webcredentials:kliko.kz
    info:
      path: Kliko-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        # НОМЕР СБОРКИ И ВЕРСИЯ — ССЫЛКАМИ, А НЕ ЧИСЛАМИ. XcodeGen, генерируя этот
        # plist, кладёт в версионные ключи литералы (CFBundleVersion=1,
        # CFBundleShortVersionString=1.0). Сборка передаёт xcodebuild
        # CURRENT_PROJECT_VERSION=<номер запуска> и MARKETING_VERSION=<версия из тега>, но это
        # НАСТРОЙКИ, и без ссылки на них в бандл уезжает единица — каждый раз, любым прогоном.
        # Всплыло это только на второй загрузке: App Store Connect отказал словами «bundle
        # version must be higher than the previously uploaded version: '1'», хотя workflow
        # думал, что шлёт седьмую сборку.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # ЭКРАН ЗАПУСКА — ФОН ЗАГРУЗОЧНОГО ЭКРАНА (SitePreloader): #f4f7f5, в тёмной теме #0d0d14 (LaunchBackground в
        # Assets). Система рисует его до нашего кода; тот же цвет у загрузочного экрана — без скачка при смене.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # ОКНО СОЗДАЁТ СЦЕНА UIKit (1.6): корнем стал KlikoHostingController — он решает, светлые часы или тёмные.
        # Одна сцена, как и раньше у WindowGroup на телефоне.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # НА ПЛАНШЕТЕ — ВСЕ ЧЕТЫРЕ. Телефон держат вертикально, планшет — как придётся, и
        # приложение, которое отказывается поворачиваться, на iPad читается как сломанное.
        # Проверяющий крутит устройство: заперев альбомную ориентацию, мы сами напрашиваемся
        # на ту же формулировку про «неудобно пользоваться». Вёрстка сайта адаптивная —
        # ей ширина безразлична.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait,
                                                UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft,
                                                UIInterfaceOrientationLandscapeRight]
        # 🔴 СВОЯ СХЕМА — ДЛЯ КНОПКИ НА САМОМ САЙТЕ. Универсальная ссылка НЕ поднимает приложение, когда по
        # ней нажимают на странице того же домена: Apple считает, что человек уже на сайте и хочет остаться.
        # Кнопка «Открыть в приложении» стоит как раз на kliko.kz — через universal link она не сработала бы
        # никогда. Поэтому у неё свой адрес kliko://open?u=<полный адрес страницы>; разбирает Config.deepLink,
        # и он же проверяет, что адрес НАШ: иначе чужая программа открыла бы в обёртке любой сайт, а там куки
        # сессии. Сайт зовёт схему только у тех, кто уже заходил из приложения (inc/app_deeplink.php).
        CFBundleURLTypes:
          - CFBundleURLName: kz.kliko.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [kliko]
        # ЧУЖИЕ СХЕМЫ, КОТОРЫЕ СПРАШИВАЕМ canOpenURL: «Расположение» на странице объявления (SiteListingLocation.swift)
        # открывает маршрут в 2ГИС, Яндекс Картах, Google Maps и такси/курьера в Яндекс Go их приложениями, а если
        # приложения нет — тем же адресом в браузере. Без этого списка canOpenURL всегда отвечает «нет».
        LSApplicationQueriesSchemes: [dgis, yandexmaps, comgooglemaps, yandextaxi, whatsapp, tg, instagram-stories, instagram]
        UIBackgroundModes: [remote-notification, fetch]   # фоновые/тихие пуши; fetch — BGAppRefreshTask (этап 12)
        # ФОНОВАЯ ПРОВЕРКА СОХРАНЁННЫХ ПОИСКОВ (этап 12, ПроверкаПоисков). Идентификатор задания обязан быть в этом
        # списке: BGTaskScheduler.register с незаявленным идентификатором роняет приложение на запуске.
        BGTaskSchedulerPermittedIdentifiers: [kz.kliko.app.saved-search]
        NSSupportsLiveActivities: true                # Live Activity сделки (локскрин/Dynamic Island)
        # ТЕКСТЫ РАЗРЕШЕНИЙ. App Review в письме по нашей сборке отдельно напомнил
        # правило 5.1.1: каждая строка обязана объяснять, ЗАЧЕМ нужен доступ, и в
        # большинстве случаев показывать ПРИМЕР того, как данные будут использованы.
        # Прежние строки называли повод, но не показывали употребление.
        NSCameraUsageDescription: "Чтобы снять товар прямо в форме объявления, найти похожие объявления по снимку и отсканировать QR при передаче: например, сфотографировать ноутбук и приложить снимок к объявлению."
        NSMicrophoneUsageDescription: "Чтобы записывать голосовые сообщения в переписке: например, объяснить состояние вещи голосом вместо длинного текста."
        NSPhotoLibraryUsageDescription: "Чтобы приложить к объявлению снимки, сделанные раньше, или найти похожие объявления по фото: например, выбрать из галереи фотографии автомобиля и добавить их в карточку."
        NSPhotoLibraryAddUsageDescription: "Чтобы сохранить в галерею изображение из объявления, ролик объявления для Reels или документ по сделке: например, видео о вашем товаре для Instagram или счёт, который вы отправляете контрагенту."
        NSLocationWhenInUseUsageDescription: "Чтобы показать объявления рядом с вами и подставить адрес в доставку: например, отсортировать ноутбуки по расстоянию и вызвать курьера к вашему дому."
        # Вход по Face ID (AppLock, 1.7): только если человек сам включил защиту в Настройках кабинета.
        NSFaceIDUsageDescription: "Чтобы открывать Kliko по Face ID, если вы включили защиту входа: например, чтобы переписку, сделки и кошелёк не увидел тот, кто взял ваш телефон."
        # Приложение шифрует только через системный HTTPS — это освобождённый случай.
        # Без этого ключа App Store Connect задаёт вопрос об экспортном соответствии на
        # КАЖДОЙ загрузке, и сборка висит в статусе «ожидает ответа» вместо TestFlight.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # иконка из Sources/Assets.xcassets/AppIcon.appiconset
        # iPHONE И iPAD. Раньше здесь стояла "1" — только телефон, с расчётом, что на
        # планшет приложение просто не попадёт. Расчёт не сработал: iPhone-приложение
        # всё равно СТАВИТСЯ на iPad, и App Review запустил сборку 1.1 на iPad Air 11"
        # (M3) в режиме совместимости, где айфонная картинка растягивается вдвое.
        # Отказ по Guideline 4: «части интерфейса обрезаны, тесно расставлены или
        # отображаются так, что пользоваться трудно». Отговорка «мы только для телефона»
        # не работает — в том же письме сказано: приложение должно работать на всех
        # устройствах, где его можно скачать.
        # С "1,2" webview получает настоящий вьюпорт планшета, и адаптив сайта наконец
        # применяется. Цена решения: App Store требует ОТДЕЛЬНЫЙ комплект скриншотов
        # для iPad — без него подача не пройдёт валидацию.
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── Виджет-расширение: Live Activity сделки ──
  KlikoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetSources
      - Shared                      # тот же DealActivityAttributes
    info:
      path: KlikoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        # ТЕ ЖЕ ЧИСЛА, ЧТО У ПРИЛОЖЕНИЯ. App Store Connect отклоняет пакет, в котором
        # версия расширения разошлась с версией приложения, — а разойтись им проще
        # простого: у литералов XcodeGen нет причины меняться вместе.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app.widgets
# ATS: наш API по HTTPS — исключений не требуется. Для http-стейджа добавь NSAppTransportSecurity в info-properties.
