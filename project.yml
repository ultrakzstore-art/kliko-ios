name: Kliko
options:
  bundleIdPrefix: kz.kliko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team ID подставляет сборка: xcodebuild получает DEVELOPMENT_TEAM аргументом из
    # секрета APPLE_TEAM_ID (.github/workflows/ios.yml). Здесь пусто намеренно — Team ID
    # виден в архиве и в логах, и держать его в репозитории незачем.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
targets:
  # ── Приложение: PWA-обёртка ──
  Kliko:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared                      # общие с виджетом типы (DealActivityAttributes)
    dependencies:
      - target: KlikoWidgets        # встраиваем виджет-расширение в приложение
    entitlements:
      path: Kliko.entitlements
      properties:
        # production, а не development. Профиль распространения, который создаёт сборка,
        # несёт aps-environment=production, и расхождение с этим файлом ломает подпись.
        # Сервер обязан быть в том же окружении: APNS_ENV='production' в admin_config.php,
        # иначе APNs отвечает BadDeviceToken и пуши молча не доходят.
        # Появится Mac и отладка на устройстве из Xcode — тогда здесь development, а на
        # сервере APNS_ENV='sandbox'; менять надо ОБА, поодиночке они бесполезны.
        aps-environment: production
    info:
      path: Kliko-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        # НОМЕР СБОРКИ И ВЕРСИЯ — ССЫЛКАМИ, А НЕ ЧИСЛАМИ. XcodeGen, генерируя этот
        # plist, кладёт в версионные ключи литералы (CFBundleVersion=1,
        # CFBundleShortVersionString=1.0). Сборка передаёт xcodebuild
        # CURRENT_PROJECT_VERSION=<номер запуска> и MARKETING_VERSION=<версия из тега>, но это
        # НАСТРОЙКИ, и без ссылки на них в бандл уезжает единица — каждый раз, любым прогоном.
        # Всплыло это только на второй загрузке: App Store Connect отказал словами «bundle
        # version must be higher than the previously uploaded version: '1'», хотя workflow
        # думал, что шлёт седьмую сборку.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # НА ПЛАНШЕТЕ — ВСЕ ЧЕТЫРЕ. Телефон держат вертикально, планшет — как придётся, и
        # приложение, которое отказывается поворачиваться, на iPad читается как сломанное.
        # Проверяющий крутит устройство: заперев альбомную ориентацию, мы сами напрашиваемся
        # на ту же формулировку про «неудобно пользоваться». Вёрстка сайта адаптивная —
        # ей ширина безразлична.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait,
                                                UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft,
                                                UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]      # фоновые/тихие пуши
        NSSupportsLiveActivities: true                # Live Activity сделки (локскрин/Dynamic Island)
        # ТЕКСТЫ РАЗРЕШЕНИЙ. App Review в письме по нашей сборке отдельно напомнил
        # правило 5.1.1: каждая строка обязана объяснять, ЗАЧЕМ нужен доступ, и в
        # большинстве случаев показывать ПРИМЕР того, как данные будут использованы.
        # Прежние строки называли повод, но не показывали употребление.
        NSCameraUsageDescription: "Чтобы снять товар прямо в форме объявления и отсканировать QR при передаче: например, сфотографировать ноутбук и приложить снимок к объявлению."
        NSMicrophoneUsageDescription: "Чтобы записывать голосовые сообщения в переписке: например, объяснить состояние вещи голосом вместо длинного текста."
        NSPhotoLibraryUsageDescription: "Чтобы приложить к объявлению снимки, сделанные раньше: например, выбрать из галереи фотографии автомобиля и добавить их в карточку."
        NSPhotoLibraryAddUsageDescription: "Чтобы сохранить в галерею изображение из объявления или документ по сделке: например, счёт или акт, которые вы отправляете контрагенту."
        NSLocationWhenInUseUsageDescription: "Чтобы показать объявления рядом с вами и подставить адрес в доставку: например, отсортировать ноутбуки по расстоянию и вызвать курьера к вашему дому."
        # Приложение шифрует только через системный HTTPS — это освобождённый случай.
        # Без этого ключа App Store Connect задаёт вопрос об экспортном соответствии на
        # КАЖДОЙ загрузке, и сборка висит в статусе «ожидает ответа» вместо TestFlight.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # иконка из Sources/Assets.xcassets/AppIcon.appiconset
        # iPHONE И iPAD. Раньше здесь стояла "1" — только телефон, с расчётом, что на
        # планшет приложение просто не попадёт. Расчёт не сработал: iPhone-приложение
        # всё равно СТАВИТСЯ на iPad, и App Review запустил сборку 1.1 на iPad Air 11"
        # (M3) в режиме совместимости, где айфонная картинка растягивается вдвое.
        # Отказ по Guideline 4: «части интерфейса обрезаны, тесно расставлены или
        # отображаются так, что пользоваться трудно». Отговорка «мы только для телефона»
        # не работает — в том же письме сказано: приложение должно работать на всех
        # устройствах, где его можно скачать.
        # С "1,2" webview получает настоящий вьюпорт планшета, и адаптив сайта наконец
        # применяется. Цена решения: App Store требует ОТДЕЛЬНЫЙ комплект скриншотов
        # для iPad — без него подача не пройдёт валидацию.
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── Виджет-расширение: Live Activity сделки ──
  KlikoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetSources
      - Shared                      # тот же DealActivityAttributes
    info:
      path: KlikoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Kliko
        # ТЕ ЖЕ ЧИСЛА, ЧТО У ПРИЛОЖЕНИЯ. App Store Connect отклоняет пакет, в котором
        # версия расширения разошлась с версией приложения, — а разойтись им проще
        # простого: у литералов XcodeGen нет причины меняться вместе.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app.widgets
# ATS: наш API по HTTPS — исключений не требуется. Для http-стейджа добавь NSAppTransportSecurity в info-properties.
