name: Kliko
options:
  bundleIdPrefix: kz.kliko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # ← впиши свой Apple Team ID в Xcode (Signing & Capabilities)
    SWIFT_VERSION: "5.9"
targets:
  Kliko:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.kliko.app
        INFOPLIST_KEY_CFBundleDisplayName: Kliko
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # ATS: наш API по HTTPS — исключений не требуется. Если тестируешь на http-стейдже, добавь NSAppTransportSecurity вручную.
