<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLX Poster — фото товара</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --accent:#23e5db; --accent-ink:#002f34; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f24; --ink:#eef1f4; --muted:#9aa3ad; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  .shoot { display:block; width:100%; padding:22px; border-radius:14px; border:2px dashed var(--muted); text-align:center; font-size:18px; font-weight:600; }
  input[type=file] { display:none; }
  .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .thumbs div { position:relative; aspect-ratio:1; }
  .thumbs img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
  .thumbs button { position:absolute; top:2px; right:2px; border:0; border-radius:50%; width:24px; height:24px; background:#000a; color:#fff; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], textarea { width:100%; padding:12px; border-radius:10px; border:1px solid #8884; background:transparent; color:inherit; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  .send { width:100%; padding:16px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-size:18px; font-weight:700; }
  .send:disabled { opacity:.5; }
  .status { text-align:center; color:var(--muted); min-height:1.4em; margin-top:10px; }
  .status.err { color:var(--err); }
  .mode { display:flex; background:var(--card); border-radius:12px; padding:4px; margin-bottom:12px; }
  .mode button { flex:1; border:0; background:none; color:var(--muted); padding:10px; border-radius:9px; font:inherit; font-weight:600; }
  .mode button.on { background:var(--accent); color:var(--accent-ink); }
  .hint { color:var(--muted); font-size:14px; margin:0 0 10px; }
  .single-only[hidden] { display:none; }
</style>
</head>
<body>
  <h1>Фото для OLX</h1>
  <div class="mode">
    <button id="m-batch" class="on">Много товаров</button>
    <button id="m-single">Один товар</button>
  </div>
  <p class="hint" id="mode-hint"></p>
  <div class="card">
    <label class="shoot" for="cam">📷 Снять фото</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <label class="shoot" for="lib" style="margin-top:8px;border-style:solid;font-size:15px;padding:12px">Выбрать из галереи</label>
    <input id="lib" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="card single-only" hidden>
    <label for="note">Подсказка для Claude (по желанию)</label>
    <textarea id="note" placeholder="Размер 42, носил месяц, есть коробка"></textarea>
    <label for="price">Цена, ₸ (пусто — Claude предложит сам)</label>
    <input id="price" type="text" inputmode="numeric" placeholder="15000">
  </div>
  <button class="send" id="send" disabled>Отправить в очередь</button>
  <div class="status" id="status"></div>

<script>
  const token = new URLSearchParams(location.search).get('t');
  const photos = [];
  let batch = true;
  const MAX = () => (batch ? 200 : 8);

  function setMode(b) {
    batch = b;
    $('m-batch').classList.toggle('on', b);
    $('m-single').classList.toggle('on', !b);
    document.querySelectorAll('.single-only').forEach((el) => { el.hidden = b; });
    $('mode-hint').textContent = b
      ? 'Снимай подряд все товары: каждый с разных сторон, бирки, характеристики. Claude сам разложит фото по объявлениям.'
      : 'Все фото — один товар (до 8). Можно добавить подсказку и цену.';
    photos.splice(MAX());
    render();
  }
  const $ = (id) => document.getElementById(id);

  // Ужимаем на телефоне: 1600 px по длинной стороне, JPEG. Заодно HEIC превращается в JPEG.
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Не удалось открыть фото'));
      img.src = URL.createObjectURL(file);
    });
  }

  function render() {
    $('thumbs').innerHTML = '';
    photos.forEach((src, i) => {
      const d = document.createElement('div');
      d.innerHTML = `<img src="${src}"><button aria-label="Убрать">×</button>`;
      d.querySelector('button').onclick = () => { photos.splice(i, 1); render(); };
      $('thumbs').appendChild(d);
    });
    $('send').disabled = photos.length === 0;
  }

  async function add(e) {
    for (const f of e.target.files) {
      if (photos.length >= MAX()) break;
      try { photos.push(await shrink(f)); } catch (err) { status(err.message, true); }
    }
    e.target.value = '';
    render();
  }
  $('cam').onchange = add;
  $('lib').onchange = add;

  function status(text, err) {
    $('status').textContent = text;
    $('status').className = 'status' + (err ? ' err' : '');
  }

  async function refreshQueue() {
    try {
      const r = await fetch('/queue?t=' + token);
      const q = await r.json();
      const waiting = (q.new || 0) + (q.describing || 0) + (q.ready || 0);
      const sorting = q.batch_photos ? ` · разбираю фото: ${q.batch_photos}` : '';
      if (!$('status').textContent || $('status').dataset.q) {
        status(`В очереди: ${waiting} · опубликовано: ${q.published || 0}${sorting}`);
        $('status').dataset.q = '1';
      }
    } catch {}
  }

  $('send').onclick = async () => {
    $('send').disabled = true;
    status('Отправляю…');
    try {
      status(`Отправляю ${photos.length} фото…`);
      const r = await fetch('/upload?t=' + token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ batch, note: batch ? '' : $('note').value, price: batch ? '' : $('price').value, photos }),
      });
      if (!r.ok) throw new Error('Компьютер не принял фото');
      photos.length = 0;
      $('note').value = '';
      $('price').value = '';
      render();
      status(batch ? 'Готово ✓ Claude раскладывает фото по товарам' : 'Готово ✓ Снимай следующий товар');
      delete $('status').dataset.q;
      setTimeout(() => { $('status').dataset.q = '1'; refreshQueue(); }, 2500);
    } catch (err) {
      status(err.message + '. Телефон и компьютер в одной Wi-Fi сети?', true);
      $('send').disabled = false;
    }
  };

  $('m-batch').onclick = () => setMode(true);
  $('m-single').onclick = () => setMode(false);
  setMode(true);
  refreshQueue();
  setInterval(refreshQueue, 15000);
</script>
</body>
</html>
