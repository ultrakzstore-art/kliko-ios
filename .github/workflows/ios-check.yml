# ─────────────────────────────────────────────────────────────────────────────
# ПРОВЕРКА СБОРКИ НА КАЖДЫЙ ПУШ В ВЕТКУ — без подписи и без TestFlight.
#
# Swift здесь пишется без Xcode под рукой (README, «Локально на Windows»), и до сих пор
# первым компилятором правки был полный прогон «iOS · TestFlight» — с секретами, подписью
# и номером сборки. Этот прогон только собирает приложение и виджет под симулятор: ошибка
# компиляции видна через несколько минут после пуша, а не при выкладке.
# Секреты не нужны, в App Store Connect ничего не уходит.
# ─────────────────────────────────────────────────────────────────────────────
name: iOS · проверка сборки

on:
  push:
    branches-ignore: [main]
  pull_request:
  # Минуты macOS (владелец 07.10.2026: аккаунт уже ограничивали): на каждый пуш — только сборка (build) и сверка с API
  # на ubuntu. Съёмка кадров (screens, 20+ минут macOS) — только вручную: Actions → «iOS · проверка сборки» →
  # Run workflow → галочка «shots».
  workflow_dispatch:
    inputs:
      shots:
        description: "Снять кадры с симулятора (job screens, 20+ минут macOS)"
        type: boolean
        default: false
      diag:
        description: "Разбор зависания: 78 и текущая рядом на симуляторе (job diag)"
        type: boolean
        default: false

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26          # тот же образ, что у сборки в TestFlight (ios.yml)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Выбрать самый новый Xcode
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null)
            [ -n "$v" ] || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Собрать под симулятор
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kliko.xcodeproj \
            -scheme Kliko \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  # СВЕРКА С ЖИВЫМ API (этап 22, владелец 25.09.2026: «давай следующие этапы»). Нативные экраны писались по
  # контракту июля без доступа к сайту; раннер GitHub сайт видит. Этот шаг ничего не проверяет на «годен/не годен» —
  # он печатает в итог прогона, что реально отдают публичные адреса, чтобы модели (Listing, ЧатОтвет) сверялись с
  # правдой, а не с памятью. Только чтение, без входа: лента, одно объявление, ответ dm.php гостю.
  api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Что отдаёт сайт
        run: |
          base="https://kliko.kz"
          ua="KlikoApp/1.10 (api-probe)"
          show() {  # заголовок, код, тип и тело (JSON — красиво и укорочено)
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            code=$(curl -sS -A "$ua" -H 'Accept: application/json' -o body -w '%{http_code} %{content_type}' "$2" || echo "curl-failed")
            echo "HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if python3 -c 'import json;json.load(open("body"))' 2>/dev/null; then
              python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("body"))
          def cut(x, depth=0):
              if isinstance(x, list):
                  return [cut(v, depth+1) for v in x[:2]] + ([f"… ещё {len(x)-2}"] if len(x) > 2 else [])
              if isinstance(x, dict):
                  return {k: cut(v, depth+1) for k, v in x.items()}
              if isinstance(x, str) and len(x) > 120:
                  return x[:120] + "…"
              return x
          print(json.dumps(cut(d), ensure_ascii=False, indent=1)[:6000])
          PY
            else
              head -c 1500 body | tee -a "$GITHUB_STEP_SUMMARY"; echo
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          show "Лента: /api/listings.php?sort=reco&page=1&per=3" "$base/api/listings.php?sort=reco&page=1&per=3"
          id=$(python3 -c 'import json;d=json.load(open("body"));print((d.get("items") or [{}])[0].get("id",""))' 2>/dev/null || true)
          cat_=$(python3 -c 'import json;d=json.load(open("body"));print((d.get("items") or [{}])[0].get("category",""))' 2>/dev/null || true)
          echo "первый id: $id, category: $cat_"
          [ -n "$id" ] && show "Объявление: /api/listings.php?id=$id" "$base/api/listings.php?id=$id"
          [ -n "$cat_" ] && show "Раздел: /api/listings.php?cat=$cat_&per=2" "$base/api/listings.php?sort=reco&page=1&per=2&cat=$cat_"
          show "Поиск: /api/listings.php?q=iphone&per=2" "$base/api/listings.php?sort=reco&page=1&per=2&q=iphone"
          show "Чат гостю: /dm.php?action=list" "$base/dm.php?action=list"
          # Оформление сайта: переменные :root и шрифты из подключённых CSS — чтобы нативные экраны брали те же цвета.
          curl -sS -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 KlikoApp/1.10" "$base/" -o home.html -L
          echo "### CSS сайта" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'href="[^"]+\.css[^"]*"' home.html | sed 's/href="//;s/"$//' | sort -u > css.txt || true
          cat css.txt
          : > all.css
          while read -r u; do case "$u" in http*) url="$u";; //*) url="https:$u";; *) url="$base/${u#/}";; esac; curl -sS "$url" >> all.css; echo >> all.css; done < css.txt
          grep -oE '<style[^>]*>' home.html | head -3
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          css = open("all.css", errors="ignore").read() + open("home.html", errors="ignore").read()
          vars_ = {}
          for m in re.finditer(r'(--[a-zA-Z0-9_-]+)\s*:\s*([^;{}]+);', css):
              k, v = m.group(1), m.group(2).strip()
              if k not in vars_ and len(v) < 80: vars_[k] = v
          print("CSS-переменных:", len(vars_))
          for k, v in list(vars_.items())[:400]: print(k, "=", v)
          fonts = sorted(set(m.strip() for m in re.findall(r'font-family\s*:\s*([^;}]+)', css)))
          print("\nШрифты:"); [print(" ", f) for f in fonts[:20]]
          PY

      # ЧТО ГОТОВО У СЕРВЕРА по заданиям iOS 1.12 (docs/SERVER_NATIVE_AUTH.md, docs/SERVER_TRYON.md, docs/OWN_AI_COVERAGE.md).
      # Без входа и без данных людей: только пробные запросы из договоров. Итог — строками ::notice:: (их видно в
      # аннотациях проверки, логи отсюда не скачиваются).
      - name: Новые адреса сервера (задание 1.12)
        run: |
          base="https://kliko.kz"
          ua="KlikoApp/1.12 (api-probe)"
          probe() {  # имя, метод, адрес, тип тела, тело → «код · Set-Cookie? · начало тела»
            name="$1"; method="$2"; url="$3"; ctype="$4"; data="$5"
            if [ "$method" = "POST" ]; then
              out=$(curl -sS -m 20 -A "$ua" -X POST -H "Content-Type: $ctype" -H 'Accept: application/json' --data "$data" -D hdr -o body -w '%{http_code}' "$url" || echo "000")
            else
              out=$(curl -sS -m 20 -A "$ua" -H 'Accept: application/json' -D hdr -o body -w '%{http_code}' "$url" || echo "000")
            fi
            cookie=$(grep -ci '^set-cookie:' hdr || true)
            body=$(head -c 140 body | tr '\n\r' '  ' | sed 's/::/: :/g')
            # GitHub показывает не больше 10 аннотаций на шаг — строки копим и выдаём пачками.
            echo "[$name] HTTP $out · cookie $cookie · $body" >> probe.txt
          }
          probe "google native {}" POST "$base/google_auth.php?action=native" "application/json" '{}'
          probe "google native text/plain" POST "$base/google_auth.php?action=native" "text/plain" '{"id_token":"x","nonce":"y"}'
          probe "google phone {}" POST "$base/google_auth.php?action=phone" "application/json" '{}'
          probe "apple native text/plain" POST "$base/apple_auth.php?action=native" "text/plain" '{"identity_token":"x","nonce":"y"}'
          probe "tryon info" GET "$base/api/tryon.php?action=info&lang=ru" "" ""
          probe "apple_iap_notify GET" GET "$base/api/apple_iap_notify.php" "" ""
          probe "photo_search гостем" POST "$base/api/photo_search.php" "application/json" '{}'
          # Есть ли новые действия кабинета: без сессии все отвечают «нужен вход», а несуществующее — иначе (сравнение).
          probe "cabinet нет такого" POST "$base/cabinet.php?action=zz_no_such_action" "application/json" '{}'
          probe "cabinet own_ai_state" POST "$base/cabinet.php?action=own_ai_state" "application/json" '{}'
          probe "cabinet own_ai_place" POST "$base/cabinet.php?action=own_ai_place" "application/json" '{}'
          probe "tryon start гостем" POST "$base/api/tryon.php?action=start" "application/json" '{}'
          probe "ai_image info" GET "$base/api/ai_image.php?action=info&lang=ru" "" ""
          probe "autofit car" GET "$base/api/autofit.php?action=car&make=Toyota&model=Camry&year=2018&lang=ru" "" ""
          # По 3 строки в одной аннотации (разделитель « ‖ »), всего не больше 6 аннотаций.
          i=0; chunk=""
          while IFS= read -r line; do
            chunk="${chunk:+$chunk ‖ }$line"; i=$((i+1))
            if [ $((i % 3)) -eq 0 ]; then echo "::notice title=probe $i::$chunk"; chunk=""; fi
          done < probe.txt
          [ -n "$chunk" ] && echo "::notice title=probe $i::$chunk" || true

  # СКРИНШОТЫ С СИМУЛЯТОРА (этап 23). Нативные экраны писались без Mac и без телефона под рукой; раннер может сам
  # запустить приложение, открыть ленту и карточку (через kliko://open — тот же путь, что у ссылки с сайта) и снять
  # экраны в светлой и тёмной теме. Снимки уходят в ветку ci/screenshots — её можно открыть на GitHub или забрать git.
  # Не роняет прогон. Только вручную с галочкой «shots» — не на пуш и не на pull request (минуты macOS).
  # РАЗБОР ЗАВИСАНИЯ 79/80 (владелец 16.10.2026: «так же висит… разберись с косяком»). Сборка 78 (f3c59be, работала) и 80
  # (97989f8, висит) — рядом, на одном симуляторе против живого kliko.kz: кадры через 3/8/15/30 с, снимок стеков всех
  # потоков (sample) на 15-й секунде, вывод приложения и журнал. Запуск — галочкой diag или словом [diag] в сообщении
  # коммита. Итог — в ветке ci/diag-<сборка> и в журнале прогона.

      - name: Ряды «Подходит вам» — сколько отдаёт сайт по разделам
        run: |
          ua="KlikoApp/1.13 (api-probe)"
          for c in bedding beds curtains lighting tv-audio mens-clothing mens-shoes womens-clothing; do
            for sort in new reco; do
              curl -sS -A "$ua" -H 'Accept: application/json' -o body "https://kliko.kz/api/listings.php?sort=$sort&page=1&per=48&cat=$c" || true
              python3 -c 'import json,sys
          d=json.load(open("body"))
          it=d.get("items") or []
          std=sum(1 for x in it if x.get("std"))
          pr=sum(1 for x in it if x.get("parts"))
          print(sys.argv[1], sys.argv[2], "ok=",d.get("ok"), "items=",len(it), "total=",d.get("total"), "с std=",std, "с parts=",pr, "cats:", sorted({x.get("category") for x in it})[:6])' "$c" "$sort" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || head -c 300 body
            done
          done
          echo "--- POST size=M в mens-clothing" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -A "$ua" -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"size":"clothes_men:INT:M"}' -o body "https://kliko.kz/api/listings.php?sort=new&page=1&per=48&cat=mens-clothing" || true
          python3 -c 'import json
          d=json.load(open("body")); it=d.get("items") or []
          print("ok=",d.get("ok"),"items=",len(it),"fit_applied=",d.get("fit_applied"),"err=",d.get("error"), "fit_match первых:", [x.get("fit_match") for x in it[:3]])' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || head -c 400 body

      # Владелец 17.10.2026 («как сделать, чтобы не резал фото — 16:9, 16:10 или какой формат лучше»): какие пропорции у
      # настоящих снимков объявлений и сколько режет каждая рамка галереи (ci/photo_ratios.py).
      - uses: actions/checkout@v7
      - name: Пропорции фото объявлений
        run: python3 ci/photo_ratios.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # Владелец 17.10.2026 («Почему снято с продажи?»): что сайт отдаёт в status и is_active (ci/status_probe.py).
      - name: Статус и is_active объявлений
        run: python3 ci/status_probe.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # Владелец 17.10.2026 («у продавца много товаров, а в профиле только 4»): откуда профиль берёт товары продавца.
      - name: Товары продавца — профиль против ленты
        run: python3 ci/seller_probe.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  diag:
    if: (github.event_name == 'workflow_dispatch' && inputs.diag) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[diag]'))
    runs-on: macos-26
    timeout-minutes: 50
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: b78
            ref: f3c59bee81cf48d244d9b0568dbdbf05c48222c3
          - label: b80
            ref: 97989f8ba7bf9f867822544eb87487d2b11b59ce
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Xcode, XcodeGen, симулятор
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          sysctl -n hw.ncpu hw.perflevel0.physicalcpu 2>/dev/null || true

      - name: Собрать
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -3
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Запуск и снимки
        run: |
          mkdir -p diag
          xcrun simctl install "$UDID" "$APP"
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          echo "объявление для ссылки: $id"
          run_case() {  # имя, аргументы запуска
            name=$1; shift
            echo "===== $name: $(date -u +%T)"
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/diag/$name-out.txt" --stderr="$PWD/diag/$name-err.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ "$@" || echo "::warning::$name: не запустилось"
            t0=$(date +%s)
            for t in 3 8 15 30; do
              while [ $(( $(date +%s) - t0 )) -lt $t ]; do sleep 1; done
              xcrun simctl io "$UDID" screenshot "diag/$name-$t.png" >/dev/null 2>&1 || true
              if [ $t = 15 ]; then
                pid=$(pgrep -f 'Kliko.app/Kliko' | head -1)
                echo "pid=$pid"
                [ -n "$pid" ] && sudo sample "$pid" 3 -file "diag/$name-sample15.txt" >/dev/null 2>&1 || true
              fi
            done
            xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "Kliko"' > "diag/$name-log.txt" 2>/dev/null || true
            echo "--- вывод приложения ($name)"; tail -60 "diag/$name-out.txt" "diag/$name-err.txt" 2>/dev/null || true
            echo "--- журнал, ошибки ($name)"; grep -iE 'error|fail|timed out|cancel|hang|deadlock|nw_|tcp|tls|-100[0-9]' "diag/$name-log.txt" | tail -60 || true
            if [ -f "diag/$name-sample15.txt" ]; then
              echo "--- стеки на 15-й секунде ($name)"
              sed -n '/Call graph:/,/Total number in stack/p' "diag/$name-sample15.txt" | head -400
            fi
          }
          run_case first
          run_case second
          [ -n "$id" ] && run_case link -klikoOpen "https://kliko.kz/marketplace?item=$id" || true
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          for f in diag/*.png; do sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la diag

      - name: Выложить в ветку ci/diag-${{ matrix.label }}
        if: always()
        run: |
          [ -d diag ] || exit 0
          cd diag
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "Разбор зависания: сборка %s (%s), прогон %s\n" "${{ matrix.label }}" "${{ matrix.ref }}" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "diag ${{ matrix.label }} $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/diag-${{ matrix.label }}

  # РАЗБОР ЗАВИСАНИЯ, ШАГ 2 (16.10.2026): на симуляторе 80 висит, 78 — нет, и только у 80 в выводе «AttributeGraph: cycle
  # detected» — цикл зависимостей SwiftUI. Здесь: (1) бисекция коммитов между 78 и 79 — кадр через 30 с и есть ли цикл;
  # (2) отладчик на 80: точка остановки на печати цикла и полный стек вызовов. Запуск — словом [diag2] в коммите.
  diag2:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diag2]')
    runs-on: macos-26
    timeout-minutes: 50
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: m32
            ref: 32f1f3f75b22d53ef755d98c13c2c7df1d32d83b
            pick: ""
            lldb: ""
          - label: w31
            ref: 31a87d776564bd6a851812298978a0e2a27ab717
            pick: 9e22e2c5f09be79d4117d88c63d5dfa0b8c34128
            lldb: ""
          - label: s9e
            ref: 9e22e2c5f09be79d4117d88c63d5dfa0b8c34128
            pick: ""
            lldb: ""
          - label: dbg80
            ref: 97989f8ba7bf9f867822544eb87487d2b11b59ce
            pick: ""
            lldb: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Подготовить исходники
        run: |
          if [ -n "${{ matrix.pick }}" ]; then
            git -c user.name=ci -c user.email=ci@example.com cherry-pick "${{ matrix.pick }}"
          fi
          git log --oneline -3

      - name: Xcode, XcodeGen, симулятор
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Собрать
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -3
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Запуск
        run: |
          mkdir -p diag
          xcrun simctl install "$UDID" "$APP"
          if [ -z "${{ matrix.lldb }}" ]; then
            xcrun simctl launch --stdout="$PWD/diag/out.txt" --stderr="$PWD/diag/err.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ
            sleep 15; xcrun simctl io "$UDID" screenshot diag/s15.png >/dev/null 2>&1 || true
            sleep 15; xcrun simctl io "$UDID" screenshot diag/s30.png >/dev/null 2>&1 || true
            echo "=== ${{ matrix.label }} stderr:"; cat diag/err.txt || true
            if grep -q "cycle detected" diag/err.txt; then echo "::warning title=${{ matrix.label }}::ЦИКЛ ЕСТЬ"; else echo "::notice title=${{ matrix.label }}::цикла нет"; fi
          else
            xcrun simctl launch --wait-for-debugger --stdout="$PWD/diag/out.txt" --stderr="$PWD/diag/err.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ
            sleep 2
            pid=$(pgrep -f 'Kliko.app/Kliko' | head -1)
            echo "pid=$pid"
            {
              echo 'settings set target.max-string-summary-length 300'
              echo 'breakpoint set -r "print_cycle"'
              echo 'breakpoint set -r "[Cc]ycle[A-Z_]*[Dd]etect"'
              echo 'breakpoint list'
              echo 'continue'
              echo 'bt 200'
              echo 'thread list'
              echo 'continue'
              echo 'bt 200'
              echo 'detach'
              echo 'quit'
            } > lldb.cmds
            perl -e 'alarm 240; exec @ARGV' sudo lldb --batch -p "$pid" -s lldb.cmds > diag/lldb.txt 2>&1 || true
            sleep 3
            xcrun simctl io "$UDID" screenshot diag/after.png >/dev/null 2>&1 || true
            echo "=== stderr:"; cat diag/err.txt || true
            echo "=== lldb:"; cut -c1-400 diag/lldb.txt | head -700
          fi
          for f in diag/*.png; do [ -f "$f" ] && sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la diag

      - name: Выложить в ветку ci/diag2-${{ matrix.label }}
        if: always()
        run: |
          [ -d diag ] || exit 0
          cd diag
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "diag2 %s (%s + %s), прогон %s\n" "${{ matrix.label }}" "${{ matrix.ref }}" "${{ matrix.pick }}" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "diag2 ${{ matrix.label }} $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/diag2-${{ matrix.label }}

  # РАЗБОР ЗАВИСАНИЯ, ШАГ 3 (16.10.2026): бисекция показала — цикл AttributeGraph приносит 1a77471 (9e22e2c чистый).
  # Варианты текущей ветки: A — без счётчика подвисаний в ленте, B — без новой раскладки нижней панели, C — без обоих.
  # Запуск — словом [diag3] в коммите.
  diag3:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diag3]')
    runs-on: macos-26
    timeout-minutes: 50
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: vA
            cut: "A"
          - label: vB
            cut: "B"
          - label: vC
            cut: "AB"
    steps:
      - uses: actions/checkout@v7

      - name: Вариант ${{ matrix.cut }}
        run: |
          python3 - "${{ matrix.cut }}" <<'PY'
          import sys
          cut = sys.argv[1]
          def patch(path, old, new):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == 1, (path, old)
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))
          if 'A' in cut:
              patch('Sources/Native/Feed/NativeFeedView.swift',
                    '                .замерПодвисанийЛистания(наГлавной ? "home" : "feed")   // подвисания при листании (ScrollHitches)\n', '')
          if 'B' in cut:
              patch('Sources/Native/NativeTabsView.swift',
                    '                    .padding(.bottom, полоска ? 0 : КлавиатураНаЭкране.низОкна)\n'
                    '                    .frame(maxHeight: .infinity, alignment: .bottom)\n'
                    '                    .ignoresSafeArea(полоска ? SafeAreaRegions() : .all, edges: .bottom)\n', '')
          print('ok', cut)
          PY
          git diff --stat

      - name: Xcode, XcodeGen, симулятор
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Собрать
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -3
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Запуск
        run: |
          mkdir -p diag
          xcrun simctl install "$UDID" "$APP"
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          xcrun simctl launch --stdout="$PWD/diag/out.txt" --stderr="$PWD/diag/err.txt" "$UDID" kz.kliko.app \
            -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ
          sleep 20; xcrun simctl io "$UDID" screenshot diag/home20.png >/dev/null 2>&1 || true
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          if [ -n "$id" ]; then
            xcrun simctl launch --stdout="$PWD/diag/out2.txt" --stderr="$PWD/diag/err2.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoOpen "https://kliko.kz/marketplace?item=$id"
            sleep 20; xcrun simctl io "$UDID" screenshot diag/link20.png >/dev/null 2>&1 || true
          fi
          echo "=== ${{ matrix.label }} stderr:"; cat diag/err.txt diag/err2.txt 2>/dev/null || true
          if cat diag/err.txt diag/err2.txt 2>/dev/null | grep -q "cycle detected"; then echo "::warning title=${{ matrix.label }}::ЦИКЛ ЕСТЬ"; else echo "::notice title=${{ matrix.label }}::цикла нет"; fi
          for f in diag/*.png; do [ -f "$f" ] && sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la diag

      - name: Выложить в ветку ci/diag3-${{ matrix.label }}
        if: always()
        run: |
          [ -d diag ] || exit 0
          cd diag
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "diag3 %s (вариант %s), коммит %s, прогон %s\n" "${{ matrix.label }}" "${{ matrix.cut }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "diag3 ${{ matrix.label }} $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/diag3-${{ matrix.label }}

  # ПРОВЕРКА ИСПРАВЛЕНИЯ ЗАВИСАНИЯ (16.10.2026): текущая ветка как есть — главная через 20 с, объявление по ссылке, нет ли
  # цикла AttributeGraph. Запуск — словом [verify] в коммите. Перед TestFlight 81.
  verify:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify]')
    runs-on: macos-26
    timeout-minutes: 50
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - label: head
            cut: ""
    steps:
      - uses: actions/checkout@v7

      - name: Вариант ${{ matrix.cut }}
        run: |
          python3 - "${{ matrix.cut }}" <<'PY'
          import sys
          cut = sys.argv[1]
          def patch(path, old, new):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == 1, (path, old)
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))
          if 'A' in cut:
              patch('Sources/Native/Feed/NativeFeedView.swift',
                    '                .замерПодвисанийЛистания(наГлавной ? "home" : "feed")   // подвисания при листании (ScrollHitches)\n', '')
          if 'B' in cut:
              patch('Sources/Native/NativeTabsView.swift',
                    '                    .padding(.bottom, полоска ? 0 : КлавиатураНаЭкране.низОкна)\n'
                    '                    .frame(maxHeight: .infinity, alignment: .bottom)\n'
                    '                    .ignoresSafeArea(полоска ? SafeAreaRegions() : .all, edges: .bottom)\n', '')
          print('ok', cut)
          PY
          git diff --stat

      - name: Xcode, XcodeGen, симулятор
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Собрать
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -3
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Запуск
        run: |
          mkdir -p diag
          xcrun simctl install "$UDID" "$APP"
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          xcrun simctl launch --stdout="$PWD/diag/out.txt" --stderr="$PWD/diag/err.txt" "$UDID" kz.kliko.app \
            -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ
          sleep 20; xcrun simctl io "$UDID" screenshot diag/home20.png >/dev/null 2>&1 || true
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          if [ -n "$id" ]; then
            xcrun simctl launch --stdout="$PWD/diag/out2.txt" --stderr="$PWD/diag/err2.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoOpen "https://kliko.kz/marketplace?item=$id"
            sleep 20; xcrun simctl io "$UDID" screenshot diag/link20.png >/dev/null 2>&1 || true
          fi
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          # «Мой дом» и «Мой гардероб» с примерными данными (только отладка: -klikoMyDemo, -klikoMy) — снимки и цикл.
          for sect in home wardrobe; do
            xcrun simctl launch --stdout="$PWD/diag/out-$sect.txt" --stderr="$PWD/diag/err-$sect.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoMyDemo YES -klikoMy "$sect"
            sleep 18; xcrun simctl io "$UDID" screenshot "diag/moe-$sect.png" >/dev/null 2>&1 || true
            xcrun simctl terminate "$UDID" kz.kliko.app || true
          done
          # Кабинет со счётчиком перерисовок (-klikoPrintChanges, только отладка): 25 с после входа сразу в кабинет.
          xcrun simctl launch --stdout="$PWD/diag/out-cabinet.txt" --stderr="$PWD/diag/err-cabinet.txt" "$UDID" kz.kliko.app \
            -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoOpen "https://kliko.kz/cabinet.php" -klikoPrintChanges YES
          sleep 25; xcrun simctl io "$UDID" screenshot "diag/cabinet.png" >/dev/null 2>&1 || true
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          echo "=== кабинет: проходы body"; grep -E "kliko-smoke\] cabinet|kliko-perf" diag/err-cabinet.txt | tail -20 || true
          # Листание главной (владелец 17.10.2026: «при скроллинге будто тяжело смартфону»; FeedScrollBench.swift): через
          # 10 с после подключения списка лента 16 с листается сама — кадры, подвисания, сколько раз считались корень
          # ленты, ряды и карточки; снимки посреди листания — успевают ли фото. Без профайлера: он в job perf. Каждый
          # прогон — с чистой установки: иначе приложение восстанавливает вкладку прошлого запуска (кабинет) и листает
          # главную за кадром. Три прогона: как есть, без фото, с простыми ячейками — что из этого стоит кадров.
          bench() {  # метка, доп. аргументы
            label=$1; shift
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            xcrun simctl uninstall "$UDID" kz.kliko.app || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch --stdout="$PWD/diag/out-scroll-$label.txt" --stderr="$PWD/diag/err-scroll-$label.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoScrollBench YES "$@"
            sleep 17; xcrun simctl io "$UDID" screenshot "diag/scroll-$label-a.png" >/dev/null 2>&1 || true
            sleep 6; xcrun simctl io "$UDID" screenshot "diag/scroll-$label-b.png" >/dev/null 2>&1 || true
            sleep 10
            xcrun simctl terminate "$UDID" kz.kliko.app || true
            echo "=== листание ($label):"; grep -E "kliko-perf\] scroll" "diag/err-scroll-$label.txt" || echo "замера листания нет"
            grep -E "kliko-perf\] scroll (total|counts)" "diag/err-scroll-$label.txt" | while IFS= read -r line; do echo "::notice title=листание $label::$line"; done || true
          }
          bench full
          bench nophotos -klikoBenchNoPhotos YES
          bench plain -klikoBenchPlain YES
          echo "=== ${{ matrix.label }} stderr:"; cat diag/err.txt diag/err2.txt diag/err-home.txt diag/err-wardrobe.txt 2>/dev/null | grep -v "^[A-Za-z_]*: @self\|changed\.$" | head -80 || true
          if cat diag/err.txt diag/err2.txt diag/err-home.txt diag/err-wardrobe.txt diag/err-cabinet.txt 2>/dev/null | grep -q "cycle detected"; then echo "::warning title=${{ matrix.label }}::ЦИКЛ ЕСТЬ"; else echo "::notice title=${{ matrix.label }}::цикла нет"; fi
          for f in diag/*.png; do [ -f "$f" ] && sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la diag

      - name: Выложить в ветку ci/verify-${{ matrix.label }}
        if: always()
        run: |
          [ -d diag ] || exit 0
          cd diag
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "verify %s (вариант %s), коммит %s, прогон %s\n" "${{ matrix.label }}" "${{ matrix.cut }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "verify ${{ matrix.label }} $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/verify-${{ matrix.label }}

  # ТОРМОЗА КАБИНЕТА (владелец 17.10.2026: «кабинет всё ещё чуть лагает — будто тяжёлое приложение»). Отладочная
  # сборка с оптимизацией -O на симуляторе, Time Profiler (xctrace): 25 с после обычного запуска (главная) и 25 с после
  # запуска сразу в кабинет (-klikoOpen …/cabinet.php). Сводка главного потока (ci/tp_summary.py) — в журнале прогона,
  # кадры — в ветке ci/perf. Запуск — словом [perf] в коммите. С 17.10.2026 — и листание ленты главной (-klikoScrollBench).
  perf:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[perf]')
    runs-on: macos-26
    timeout-minutes: 80
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Xcode, XcodeGen, симулятор
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          sudo DevToolsSecurity -enable || true
          brew install xcodegen
          xcodegen generate
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Собрать (отладка с -O)
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -3
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Профиль — главная и кабинет
        run: |
          mkdir -p perf
          xcrun simctl install "$UDID" "$APP"
          # ПРЕДОХРАНИТЕЛЬ (17.10.2026): xctrace record однажды завис на подключении к процессу и простоял 24 мин до
          # конца job — замер листания так и не начался. Каждый вызов xctrace — не дольше заданных секунд (perl alarm).
          with_limit() { secs=$1; shift; perl -e 'alarm shift @ARGV; exec @ARGV' "$secs" "$@"; }
          profile_case() {  # имя, аргументы запуска
            name=$1; shift
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            out=$(xcrun simctl launch --stderr="$PWD/perf/$name-err.txt" "$UDID" kz.kliko.app \
              -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ "$@")
            pid=$(echo "$out" | awk -F': ' '{print $2}' | tr -d ' ')
            echo "$name: pid=$pid"
            with_limit 90 xcrun xctrace record --template 'Time Profiler' --device "$UDID" --attach "$pid" --time-limit 25s \
              --output "perf/$name.trace" > "perf/$name-record.txt" 2>&1 || { echo "::warning::xctrace record $name"; tail -20 "perf/$name-record.txt"; }
            xcrun simctl io "$UDID" screenshot "perf/$name.png" >/dev/null 2>&1 || true
            with_limit 180 xcrun xctrace export --input "perf/$name.trace" \
              --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output "perf/$name.xml" 2>&1 | tail -3 || true
            echo "===================== $name"
            [ -f "perf/$name.xml" ] && python3 ci/tp_summary.py "perf/$name.xml" 45 | tee "perf/$name-summary.txt" || echo "нет экспорта"
          }
          # ЛИСТАНИЕ ЛЕНТЫ (владелец 17.10.2026: «при скроллинге будто тяжело смартфону»): -klikoScrollBench YES — через
          # 10 с после подключения списка главная 16 с листается сама (FeedScrollBench.swift). Time Profiler — с 8-й по
          # 34-ю секунду, снимки — посреди листания (видно, успевают ли фото). Итог замера — строки [kliko-perf] scroll.
          xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
          out=$(xcrun simctl launch --stderr="$PWD/perf/scroll-err.txt" "$UDID" kz.kliko.app \
            -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ -klikoScrollBench YES)
          pid=$(echo "$out" | awk -F': ' '{print $2}' | tr -d ' ')
          echo "scroll: pid=$pid"
          sleep 8
          ( sleep 9; xcrun simctl io "$UDID" screenshot perf/scroll-a.png >/dev/null 2>&1
            sleep 6; xcrun simctl io "$UDID" screenshot perf/scroll-b.png >/dev/null 2>&1 ) &
          with_limit 90 xcrun xctrace record --template 'Time Profiler' --device "$UDID" --attach "$pid" --time-limit 26s \
            --output perf/scroll.trace > perf/scroll-record.txt 2>&1 || { echo "::warning::xctrace record scroll"; tail -20 perf/scroll-record.txt; }
          sleep 3
          with_limit 180 xcrun xctrace export --input perf/scroll.trace \
            --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output perf/scroll.xml 2>&1 | tail -3 || true
          echo "===================== scroll"
          grep -E "kliko-perf\] scroll|scroll-bench" perf/scroll-err.txt | tee perf/scroll-bench.txt || echo "замера листания нет"
          grep -E "kliko-perf\] scroll (total|counts)" perf/scroll-err.txt | while IFS= read -r line; do echo "::notice title=листание::$line"; done || true
          [ -f perf/scroll.xml ] && python3 ci/tp_summary.py perf/scroll.xml 60 | tee perf/scroll-summary.txt || echo "нет экспорта"
          profile_case home
          profile_case cabinet -klikoOpen "https://kliko.kz/cabinet.php"
          for f in perf/*.png; do [ -f "$f" ] && sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          rm -rf perf/*.trace perf/*.xml
          ls -la perf

      - name: Выложить в ветку ci/perf
        if: always()
        run: |
          [ -d perf ] || exit 0
          cd perf
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "perf: коммит %s, прогон %s\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "perf $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/perf

  screens:
    if: github.event_name == 'workflow_dispatch' && inputs.shots
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Xcode и XcodeGen
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate

      - name: Симулятор
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]:
                      print(x["udid"]); raise SystemExit
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Собрать под этот симулятор
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.13 CURRENT_PROJECT_VERSION=999 | tail -5
          # Версия как у выпуска: с 0.1.0 из project.yml поверх снимков вставало окно «Эта версия устарела».
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      # КАДРЫ APP STORE (fastlane/screenshots): светлая тема, полный размер, iPhone, на русском и английском. Листы
      # открываются сами аргументом -klikoSheet (СъёмкаCI, только отладочная сборка): garant — «Как работает Безопасная
      # сделка», filters — фильтры ленты, qr — QR-код карточки. Свой шаг с пределом времени: что успело сняться, уходит
      # в ветку ci/store-shots следующим шагом в любом случае, остальные снимки не задерживаются.
      - name: Кадры App Store
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p store
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light
          shot() {  # язык (ru/en), имя, пауза, аргументы запуска
            lang=$1; name=$2; wait=$3; shift 3
            loc=ru_KZ; [ "$lang" = en ] && loc=en_KZ
            echo "$(date -u +%T) $name: запуск"
            xcrun simctl launch --terminate-running-process "$UDID" kz.kliko.app -klikoNoPushPrompt YES \
              -AppleLanguages "($lang)" -AppleLocale "$loc" "$@" || echo "::warning::$name: не запустилось"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "store/$name.png" || echo "::warning::$name: не снялось"
            echo "$(date -u +%T) $name: готово"
          }
          for lang in ru en; do
            shot $lang "iphone-$lang-garant" 22 -klikoSheet garant
            shot $lang "iphone-$lang-filtry" 22 -klikoSheet filters
            if [ -n "$id" ]; then shot $lang "iphone-$lang-qr" 28 -klikoOpen "https://kliko.kz/marketplace?item=$id" -klikoSheet qr; fi
            shot $lang "iphone-$lang-lenta" 22
          done
          xcrun simctl terminate "$UDID" kz.kliko.app || true
          ls -la store

      - name: Кадры App Store · iPad
        timeout-minutes: 14
        continue-on-error: true
        run: |
          mkdir -p store
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          ipad=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for want in ("13-inch", "iPad Pro", "iPad"):
              for k in rt:
                  for x in d[k]:
                      if x["name"].startswith("iPad") and want in x["name"]:
                          print(x["udid"]); raise SystemExit
          ' || true)
          [ -n "$ipad" ] || { echo "::warning::Нет симулятора iPad"; exit 0; }
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$ipad" || true
          for i in $(seq 1 60); do xcrun simctl list devices | grep "$ipad" | grep -q Booted && break; sleep 5; done
          sleep 15
          xcrun simctl status_bar "$ipad" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install "$ipad" "$APP"
          xcrun simctl ui "$ipad" appearance light
          shot() {
            lang=$1; name=$2; wait=$3; shift 3
            loc=ru_KZ; [ "$lang" = en ] && loc=en_KZ
            echo "$(date -u +%T) $name: запуск"
            xcrun simctl launch --terminate-running-process "$ipad" kz.kliko.app -klikoNoPushPrompt YES \
              -AppleLanguages "($lang)" -AppleLocale "$loc" "$@" || echo "::warning::$name: не запустилось"
            sleep "$wait"
            xcrun simctl io "$ipad" screenshot "store/$name.png" || echo "::warning::$name: не снялось"
          }
          for lang in ru en; do
            shot $lang "ipad-$lang-garant" 25 -klikoSheet garant
            shot $lang "ipad-$lang-filtry" 22 -klikoSheet filters
            if [ -n "$id" ]; then shot $lang "ipad-$lang-qr" 28 -klikoOpen "https://kliko.kz/marketplace?item=$id" -klikoSheet qr; fi
          done
          xcrun simctl shutdown "$ipad" || true
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 5; done
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Выложить кадры App Store в ветку ci/store-shots
        if: always()
        run: |
          [ -n "$(ls store 2>/dev/null)" ] || { echo "::warning::Кадров App Store нет"; exit 0; }
          cd store
          for f in *.png; do sips -s format jpeg -s formatOptions 92 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "Кадры App Store: коммит %s, ветка %s\n" "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Кадры App Store $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/store-shots
          echo "::notice title=Кадры App Store::$(ls *.jpg | tr '\n' ' ')"

      - name: Снять экраны
        run: |
          mkdir -p shots
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          echo "объявление для карточки: $id"
          snap() { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          xcrun simctl install "$UDID" "$APP"
          run() {  # имя снимка, пауза, аргументы запуска
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            xcrun simctl launch "$UDID" kz.kliko.app -klikoNoPushPrompt YES -AppleLanguages "(ru)" -AppleLocale ru_KZ "$@"
            sleep "$wait"; snap "$name"
          }
          for theme in light dark; do
            xcrun simctl ui "$UDID" appearance "$theme"
            run "1-lenta-$theme" 25
            [ -n "$id" ] && run "2-kartochka-$theme" 15 -klikoOpen "https://kliko.kz/marketplace?item=$id"
            # Эталон: сайт в обёртке приложения (без плашки Safari «В приложении удобнее»). ?ci=1 — чтобы адрес не
            # считался главной и не уходил в нативную ленту.
            run "3-sait-glavnaya-$theme" 25 -klikoSite "https://kliko.kz/kz/ru/?ci=1"
            [ -n "$id" ] && run "4-sait-kartochka-$theme" 20 -klikoSite "https://kliko.kz/marketplace?item=$id&ci=1"
          done
          # «Моё» сразу на разделе (-klikoMy, только отладочная сборка) с демонстрационным «Моим» только в памяти
          # (-klikoMyDemo, MyThingsDebug.swift): заполненные разделы дома и гардероба и ряды «Подходит вам» — ряд есть,
          # только если в свежих объявлениях раздела нашлось подходящее.
          # stderr — рядом со снимком (уходит в ci/screenshots): метки [kliko-smoke] my-demo, my-open и my-row <раздел>
          # <карточек> отличают пустой ряд (ничего не подошло) от несработавшей загрузки или неоткрывшегося окна.
          run_moe() {  # как run, но со своим stderr
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            xcrun simctl launch --stderr="$PWD/shots/$name-err.txt" "$UDID" kz.kliko.app -klikoNoPushPrompt YES \
              -AppleLanguages "(ru)" -AppleLocale ru_KZ "$@"
            sleep "$wait"; snap "$name"
            grep -h kliko-smoke "shots/$name-err.txt" || echo "::warning::$name: меток my-* нет"
          }
          xcrun simctl ui "$UDID" appearance light
          run_moe "5-moe-dom-light" 25 -klikoMy дом -klikoMyDemo YES
          run_moe "6-moe-garderob-light" 25 -klikoMy гардероб -klikoMyDemo YES
          # Исходники сайта рядом со снимками: HTML главной и карточки, все подключённые CSS — точные цвета, картинки
          # плиток и адреса кнопок для нативных экранов.
          mkdir -p shots/site
          ua="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KlikoApp/1.10"
          curl -sSL -A "$ua" "https://kliko.kz/kz/ru/" -o shots/site/home.html || true
          [ -n "$id" ] && curl -sSL -A "$ua" "https://kliko.kz/marketplace?item=$id" -o shots/site/item.html || true
          cat shots/site/*.html | grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' | sed -E 's/^(href|src)="//;s/"$//' | sort -u > shots/site/assets.txt || true
          n=0; while read -r u; do case "$u" in http*) url="$u";; //*) url="https:$u";; *) url="https://kliko.kz/${u#/}";; esac
            case "$url" in *kliko.kz*) n=$((n+1)); curl -sSL "$url" -o "shots/site/$(printf %02d $n)-$(basename "${u%%\?*}")" || true;; esac
          done < shots/site/assets.txt
          # Для совпадения приложения с сайтом по функциям (владелец 25.09.2026: «всё одно и то же, просто код разный»):
          # что сайт показывает гостю на страницах кабинета (вход, подача, eGov, кошелёк) и полный список страниц сайта по
          # ссылкам главной и карточки — основа таблицы «страница сайта ↔ экран приложения».
          mkdir -p shots/site/guest
          for pth in "kz/ru/cabinet.php" "kz/ru/cabinet?go=add" "kz/ru/cabinet?egov=1" "kz/ru/cabinet.php?go=wallet" "kz/ru/cabinet.php?s=messages"; do
            f="shots/site/guest/$(echo "$pth" | tr '/?=&' '____').html"
            curl -sSL -A "$ua" -c shots/site/guest/cookies.txt -b shots/site/guest/cookies.txt "https://kliko.kz/$pth" -o "$f" -w "$pth -> %{http_code} %{url_effective}\n" || true
          done
          rm -f shots/site/guest/cookies.txt
          cat shots/site/guest/*.html | grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' | sed -E 's/^(href|src)="//;s/"$//' | sort -u > shots/site/guest/assets.txt || true
          while read -r u; do case "$u" in http*) url="$u";; //*) url="https:$u";; *) url="https://kliko.kz/${u#/}";; esac
            b=$(basename "${u%%\?*}"); ls shots/site/*-"$b" >/dev/null 2>&1 && continue
            case "$url" in *kliko.kz*) curl -sSL "$url" -o "shots/site/guest/$b" || true;; esac
          done < shots/site/guest/assets.txt
          cat shots/site/*.html shots/site/guest/*.html | grep -oE 'href="(/[^"#]*|https://kliko\.kz/[^"#]*)"' | sed -E 's/^href="//;s/"$//;s#https://kliko.kz##' | sed -E 's/[?&](v|t|utm_[a-z]+)=[^&]*//g' | sort | uniq -c | sort -rn > shots/site/pages.txt || true
          wc -l shots/site/pages.txt; ls -la shots/site/guest
          ls -la shots/site
          # Уменьшаем и в JPEG: полноразмерные PNG по 2 МБ выгружались в ветку четверть часа.
          for f in shots/*.png; do sips -Z 1300 -s format jpeg -s formatOptions 80 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la shots
          [ -n "$(ls shots/*.jpg 2>/dev/null)" ] || { echo "::error::Снимков нет"; exit 1; }

      - name: Выложить в ветку ci/screenshots
        run: |
          cd shots
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "Снимки с симулятора: коммит %s, ветка %s\n" "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Скриншоты $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/screenshots
