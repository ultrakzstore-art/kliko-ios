# ─────────────────────────────────────────────────────────────────────────────
# ПРОВЕРКА СБОРКИ НА КАЖДЫЙ ПУШ В ВЕТКУ — без подписи и без TestFlight.
#
# Swift здесь пишется без Xcode под рукой (README, «Локально на Windows»), и до сих пор
# первым компилятором правки был полный прогон «iOS · TestFlight» — с секретами, подписью
# и номером сборки. Этот прогон только собирает приложение и виджет под симулятор: ошибка
# компиляции видна через несколько минут после пуша, а не при выкладке.
# Секреты не нужны, в App Store Connect ничего не уходит.
# ─────────────────────────────────────────────────────────────────────────────
name: iOS · проверка сборки

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26          # тот же образ, что у сборки в TestFlight (ios.yml)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Выбрать самый новый Xcode
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null)
            [ -n "$v" ] || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Собрать под симулятор
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kliko.xcodeproj \
            -scheme Kliko \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  # СВЕРКА С ЖИВЫМ API (этап 22, владелец 25.09.2026: «давай следующие этапы»). Нативные экраны писались по
  # контракту июля без доступа к сайту; раннер GitHub сайт видит. Этот шаг ничего не проверяет на «годен/не годен» —
  # он печатает в итог прогона, что реально отдают публичные адреса, чтобы модели (Listing, ЧатОтвет) сверялись с
  # правдой, а не с памятью. Только чтение, без входа: лента, одно объявление, ответ dm.php гостю.
  api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Что отдаёт сайт
        run: |
          base="https://kliko.kz"
          ua="KlikoApp/1.10 (api-probe)"
          show() {  # заголовок, код, тип и тело (JSON — красиво и укорочено)
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            code=$(curl -sS -A "$ua" -H 'Accept: application/json' -o body -w '%{http_code} %{content_type}' "$2" || echo "curl-failed")
            echo "HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if python3 -c 'import json;json.load(open("body"))' 2>/dev/null; then
              python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("body"))
          def cut(x, depth=0):
              if isinstance(x, list):
                  return [cut(v, depth+1) for v in x[:2]] + ([f"… ещё {len(x)-2}"] if len(x) > 2 else [])
              if isinstance(x, dict):
                  return {k: cut(v, depth+1) for k, v in x.items()}
              if isinstance(x, str) and len(x) > 120:
                  return x[:120] + "…"
              return x
          print(json.dumps(cut(d), ensure_ascii=False, indent=1)[:6000])
          PY
            else
              head -c 1500 body | tee -a "$GITHUB_STEP_SUMMARY"; echo
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          show "Лента: /api/listings.php?sort=reco&page=1&per=3" "$base/api/listings.php?sort=reco&page=1&per=3"
          id=$(python3 -c 'import json;d=json.load(open("body"));print((d.get("items") or [{}])[0].get("id",""))' 2>/dev/null || true)
          cat_=$(python3 -c 'import json;d=json.load(open("body"));print((d.get("items") or [{}])[0].get("category",""))' 2>/dev/null || true)
          echo "первый id: $id, category: $cat_"
          [ -n "$id" ] && show "Объявление: /api/listings.php?id=$id" "$base/api/listings.php?id=$id"
          [ -n "$cat_" ] && show "Раздел: /api/listings.php?cat=$cat_&per=2" "$base/api/listings.php?sort=reco&page=1&per=2&cat=$cat_"
          show "Поиск: /api/listings.php?q=iphone&per=2" "$base/api/listings.php?sort=reco&page=1&per=2&q=iphone"
          show "Чат гостю: /dm.php?action=list" "$base/dm.php?action=list"
          # Оформление сайта: переменные :root и шрифты из подключённых CSS — чтобы нативные экраны брали те же цвета.
          curl -sS -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 KlikoApp/1.10" "$base/" -o home.html -L
          echo "### CSS сайта" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'href="[^"]+\.css[^"]*"' home.html | sed 's/href="//;s/"$//' | sort -u > css.txt || true
          cat css.txt
          : > all.css
          while read -r u; do case "$u" in http*) url="$u";; //*) url="https:$u";; *) url="$base/${u#/}";; esac; curl -sS "$url" >> all.css; echo >> all.css; done < css.txt
          grep -oE '<style[^>]*>' home.html | head -3
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          css = open("all.css", errors="ignore").read() + open("home.html", errors="ignore").read()
          vars_ = {}
          for m in re.finditer(r'(--[a-zA-Z0-9_-]+)\s*:\s*([^;{}]+);', css):
              k, v = m.group(1), m.group(2).strip()
              if k not in vars_ and len(v) < 80: vars_[k] = v
          print("CSS-переменных:", len(vars_))
          for k, v in list(vars_.items())[:400]: print(k, "=", v)
          fonts = sorted(set(m.strip() for m in re.findall(r'font-family\s*:\s*([^;}]+)', css)))
          print("\nШрифты:"); [print(" ", f) for f in fonts[:20]]
          PY

  # СКРИНШОТЫ С СИМУЛЯТОРА (этап 23). Нативные экраны писались без Mac и без телефона под рукой; раннер может сам
  # запустить приложение, открыть ленту и карточку (через kliko://open — тот же путь, что у ссылки с сайта) и снять
  # экраны в светлой и тёмной теме. Снимки уходят в ветку ci/screenshots — её можно открыть на GitHub или забрать git.
  # Не роняет прогон.
  screens:
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Xcode и XcodeGen
        run: |
          best=""; bestkey=0
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            key=$(echo "$v" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$key" -gt "$bestkey" ]; then bestkey="$key"; best="$app"; fi
          done
          sudo xcode-select -s "$best"
          brew install xcodegen
          xcodegen generate

      - name: Симулятор
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted([k for k in d if "iOS" in k], reverse=True)
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]:
                      print(x["udid"]); raise SystemExit
          for k in rt:
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); raise SystemExit
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Собрать под этот симулятор
        run: |
          set -o pipefail
          xcodebuild build -project Kliko.xcodeproj -scheme Kliko -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tail -5
          app=$(find build/dd/Build/Products -maxdepth 2 -name 'Kliko.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Снять экраны
        run: |
          mkdir -p shots
          id=$(curl -sS 'https://kliko.kz/api/listings.php?sort=reco&page=1&per=1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["items"][0]["id"])' || true)
          echo "объявление для карточки: $id"
          snap() { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          xcrun simctl install "$UDID" "$APP"
          run() {  # имя снимка, пауза, аргументы запуска
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" kz.kliko.app 2>/dev/null || true
            xcrun simctl launch "$UDID" kz.kliko.app -klikoNoPushPrompt YES "$@"
            sleep "$wait"; snap "$name"
          }
          for theme in light dark; do
            xcrun simctl ui "$UDID" appearance "$theme"
            run "1-lenta-$theme" 25
            [ -n "$id" ] && run "2-kartochka-$theme" 15 -klikoOpen "https://kliko.kz/marketplace?item=$id"
            # Эталон: сайт в обёртке приложения (без плашки Safari «В приложении удобнее»). ?ci=1 — чтобы адрес не
            # считался главной и не уходил в нативную ленту.
            run "3-sait-glavnaya-$theme" 25 -klikoSite "https://kliko.kz/kz/ru/?ci=1"
            [ -n "$id" ] && run "4-sait-kartochka-$theme" 20 -klikoSite "https://kliko.kz/marketplace?item=$id&ci=1"
          done
          # Уменьшаем и в JPEG: полноразмерные PNG по 2 МБ выгружались в ветку четверть часа.
          for f in shots/*.png; do sips -Z 1300 -s format jpeg -s formatOptions 80 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la shots
          [ -n "$(ls shots/*.jpg 2>/dev/null)" ] || { echo "::error::Снимков нет"; exit 1; }

      - name: Выложить в ветку ci/screenshots
        run: |
          cd shots
          git init -q
          git config user.name "kliko-ci"
          git config user.email "ci@users.noreply.github.com"
          printf "Снимки с симулятора: коммит %s, ветка %s\n" "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Скриншоты $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/screenshots
